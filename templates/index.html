<!DOCTYPE html>
<html lang="$html_lang">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Sheng-Shan Chen">
<meta name="description" content="$description">
<meta name="keywords" content="$keywords">
<link rel="canonical" href="$page_url">
<link rel="alternate" hreflang="zh-Hant" href="https://stwater20.github.io/">
<link rel="alternate" hreflang="en" href="https://stwater20.github.io/en/">
<link rel="alternate" hreflang="x-default" href="https://stwater20.github.io/">
<title>$title</title>

<meta property="og:type" content="profile">
<meta property="og:url" content="$page_url">
<meta property="og:title" content="$title">
<meta property="og:locale" content="$og_locale">
<meta property="og:description" content="$description">
<meta property="og:image" content="https://stwater20.github.io/assets/avatar.jpg">
<meta name="twitter:card" content="summary">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-7L057F14ET"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-7L057F14ET');
</script>
<script type="application/ld+json">$jsonld</script>

<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/resume.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="progress" aria-hidden="true"><div class="progress__bar"></div></div>
<div class="container">
  <header class="header">
    <span class="header__inner">
      <a href="$home_path" style="text-decoration: none;">
        <div class="logo">
          <span class="logo__mark">&gt;</span>
          <span class="logo__text">$$ cd /home/</span>
          <span class="logo__cursor"></span>
        </div>
      </a>
      <span class="header__right">
        <nav class="menu">
          <ul class="menu__inner">
            <li><a href="#experience">$nav_experience</a></li>
            <li><a href="#publications">$nav_publications</a></li>
            <li><a href="$switch_path" hreflang="$switch_lang" lang="$switch_lang">$switch_label</a></li>
          </ul>
        </nav>
        <span class="menu-trigger">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </span>
      </span>
    </span>
  </header>

  <div class="content">
    <main class="post resume">
      <section class="resume-hero">
        <img class="avatar" src="/assets/avatar.jpg" alt="$name_plain" width="120" height="120">
        <div>
          <h1 class="post-title">$name</h1>
          <div class="post-content intro">
$intro
          </div>
        </div>
      </section>

      <nav class="resume-toc" aria-label="$toc_label">
$toc
      </nav>

      <div class="post-content">
$sections
      </div>

      <hr>
      <p class="sync-note">
        $sync_note
      </p>
    </main>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__content">
        <span>&copy; $year</span>
        <span><a href="$home_path">Sheng-Shan Chen</a></span>
        <span><a href="https://github.com/stwater20" target="_blank" rel="noopener">GitHub</a></span>
      </div>
    </div>
  </footer>
</div>
<a href="#" class="to-top" aria-label="$to_top_label">↑</a>
<div class="print-mark" aria-hidden="true">stwater20.github.io</div>
<div class="print-footer" aria-hidden="true">${print_source}$page_url · $print_date_label <span id="print-date"></span></div>
<script>
  // Mobile menu toggle (replaces the old Hugo theme bundle, which used the same .hidden class).
  (function () {
    var trigger = document.querySelector('.menu-trigger');
    var menu = document.querySelector('.menu');
    if (!trigger || !menu) return;
    var mq = window.matchMedia('(max-width: 684px)');
    function sync() { menu.classList.toggle('hidden', mq.matches); }
    sync();
    if (mq.addEventListener) mq.addEventListener('change', sync);
    trigger.addEventListener('click', function (e) { e.stopPropagation(); if (mq.matches) menu.classList.toggle('hidden'); });
    document.addEventListener('click', function () { if (mq.matches) menu.classList.add('hidden'); });
  })();
  // Back-to-top button appears after scrolling past the intro.
  (function () {
    var btn = document.querySelector('.to-top');
    function onScroll() { btn.classList.toggle('show', window.scrollY > 600); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    btn.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  })();
  // Reading progress bar along the top edge.
  (function () {
    var bar = document.querySelector('.progress__bar');
    var ticking = false;
    function update() {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(window.scrollY / max, 1) : 0) + ')';
      ticking = false;
    }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
  })();
  // Stamp the print date into the print-only footer.
  (function () {
    var d = new Date();
    document.getElementById('print-date').textContent =
      d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  })();
</script>
</body>
</html>
