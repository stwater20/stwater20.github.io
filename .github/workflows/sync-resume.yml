name: Sync resume from SecTools.tw

# Manual only: run it from the Actions tab (Sync resume → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resume
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits non-zero (and changes nothing) when SecTools.tw is down or returns
      # incomplete content, so the last good resume stays published.
      - name: Fetch and render
        run: python3 scripts/sync_resume.py

      - name: Commit if changed
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/resume.json assets/avatar.jpg
          git commit -m "chore: sync resume from sectools.tw"
          git push
