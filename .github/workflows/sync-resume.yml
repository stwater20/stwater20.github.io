name: Sync resume from SecTools.tw

# Manual only: run it from the Actions tab (Sync resume → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-resume
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits non-zero (and changes nothing) when SecTools.tw is down or returns
      # incomplete content, so the last good resume stays published.
      - name: Fetch and render
        run: python3 scripts/sync_resume.py

      # Changes go to a PR so the diff can be reviewed before the site updates.
      # Requires: Settings → Actions → General → "Allow GitHub Actions to create
      # and approve pull requests".
      - name: Open pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/resume
          delete-branch: true
          add-paths: |
            index.html
            data/resume.json
            assets/avatar.jpg
          commit-message: "chore: sync resume from sectools.tw"
          title: "Sync resume from sectools.tw"
          body: |
            Automated sync from https://sectools.tw/about/sean.
            Check the diff of `data/resume.json`, then merge to publish.
